(function(){

 function normalizeCOP(){
   scheduled=false;
   const root=document.getElementById('content');if(!root)return;
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   const nodes=[];let n;
   while((n=walker.nextNode())){
     if(!/\bCOP(?=\s*[+−-]?[0-9])/.test(n.nodeValue))continue;
     if(n.parentElement && n.parentElement.closest('.nora-cop-unit,script,style,textarea,input'))continue;
     nodes.push(n);
   }
   nodes.forEach(node=>{
     if(!node.parentNode)return;
     const parts=node.nodeValue.split(/(\bCOP)(?=\s*[+−-]?[0-9])/g);
     if(parts.length<2)return;
     const frag=document.createDocumentFragment();
     parts.forEach(part=>{
       if(part==='COP'){const span=document.createElement('span');span.className='nora-cop-unit';span.textContent='COP';frag.appendChild(span);}
       else if(part)frag.appendChild(document.createTextNode(part));
     });
     node.parentNode.replaceChild(frag,node);
   });

</style><script id="review-navigation">/* Interactive review navigation only; no production operations or messages. */

const rnOriginalShow=show;show=function(id){rnOriginalShow(id);rnDecorate();};
