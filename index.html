const portrait=(name,initial,photo=false)=>`<span class="person-face ${photo&&LOCAL_PORTRAITS[name]?'photo':''}">${photo&&LOCAL_PORTRAITS[name]?`<img alt="Illustrative portrait" src="${LOCAL_PORTRAITS[name]}">`:esc(initial)}</span>`;
const demoPeople=[['Luka D.','L','500,000',true],['Macaulay C.','M','480,000',true],['Miguel B.','M','520,000',true],['Nora A.','N','500,000',true],['Paul Smith','P','610,000',true],['Joe Shmoe','J','475,000',true],['Diego R.','D','450,000',true],['Mikey B.','M','525,000',true]];
function fixedNav(active){return `<div class="ux-bottom">${['Table','Players','Team','Expenses','Snapshot','Close'].map(x=>`<div class="ux-tab ${x===active?'chosen':''}"><span class="ux-ico">${ICONS[x]}</span><span>${x}</span></div>`).join('')}</div>`}
function fullHead(title,sub){return `<div class="ux-head"><span class="ux-hamb">☰</span><div class="ux-headtitle"><b>${esc(title)}</b><small>${esc(sub)}</small></div><span class="ux-nora">${portrait('Nora','N',true)}</span><span class="ux-close">×</span></div>`}
function miniTable(updated=false){let data=demoPeople.map(([name,initial,amount,photo],j)=>`<div class="ux-seat tone-${j%6}"><span class="ux-seatno">${j+1}</span>${portrait(name,initial,photo)}<div class="ux-seat-label"><b>${name}</b><strong>${updated&&name==='Diego R.'?'1,450,000':amount}</strong></div></div>`).join('');return `<div class="ux-seats">${data}<div class="ux-seat empty"><strong>⊕</strong><b>Open Seat</b></div><div class="ux-seat empty"><strong>⊕</strong><b>Open Seat</b></div><div class="ux-seat tone-4">${portrait('Anna','A',true)}<div class="ux-seat-label"><b>DEALER</b><strong>Anna</strong></div></div><div class="ux-seat empty"><strong>♙</strong><b>WAIT LIST</b><span>1 waiting</span></div></div>`}
const noraInput=()=>`<div class="ux-composer"><span>Ask Nora or give a command…</span><b>🎙</b><b>➤</b></div>`;
function actionButtons(items){return `<div class="ux-actions">${items.map((x,j)=>`<div class="ux-action tone-${j%6}">${esc(x)}</div>`).join('')}</div>`}
function inputPanel(title,fields,button='CONFIRM'){return `<div class="ux-section">${esc(title)}</div>${fields.map(([k,v])=>`<div class="ux-field"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}<div class="ux-cta">${esc(button)}</div>`}
function listPanel(kind){let items=kind==='Team'?[['Anna','Dealer','ON SHIFT'],['Costa','Host','ON SHIFT'],['Alex','Cashier','ON SHIFT']]:kind==='Expenses'?[['Venue rental','Cash','1,000,000'],['Drinks','Cash','150,000'],['Food','Cash','85,000']]:[['Diego Restrepo','Seat 7','450,000'],['Rafa','Seat 1','450,000'],['Moshe','Seat 2','1,200,000']];return `<div class="ux-section">${esc(kind.toUpperCase())} · LIVE</div><div class="ux-list">${items.map(([n,s,v],i)=>`<div class="ux-listrow tone-${i%6}">${portrait(n,n[0],i!==1)}<div><b>${esc(n)}</b><small>${esc(s)}</small></div><strong>${esc(v)}</strong></div>`).join('')}</div><div class="ux-cta">＋ ADD ${kind==='Team'?'TEAM MEMBER':kind==='Expenses'?'EXPENSE':'PLAYER'}</div>`}
function metricPanel(kind){let entries=kind==='Snapshot'?[['TOTAL BUY-INS','COP 5,500,000'],['CASH-OUTS','COP 0'],['DROP / RAKE','COP 780,000'],['CHIPS IN PLAY','COP 5,500,000'],['TIPS','COP 0'],['NET BALANCE','COP 780,000'],['GROSS REVENUE','COP 780,000'],['PLAYERS','8'],['EXPENSES','COP 0'],['TABLE','Hold’em'],['RUNTIME','5d 6h 32m'],['RAKE STRUCTURE','5% per pot']]:kind==='Close'?[['TOTAL BUY-INS','5,500,000'],['TOTAL CASH-OUTS','0'],['TIPS IN CHIPS','0'],['CHIP VARIANCE','REVIEW'],['S&S OUTSTANDING','0'],['CASHBOX','5,500,000']]:[['TOTAL RAKE','780,000'],['HOURS','5.5'],['PLAYERS','8'],['AVG / HR','141,818'],['TABLES','1'],['GAME','Hold’em']];return `<div class="ux-metrics ${kind==='Snapshot'?'ux-snapshot':''}">${entries.map(([a,b],i)=>`<div class="ux-metric tone-${i%3===1?1:i%3===2?2:0}"><b>${b}</b><small>${a}</small></div>`).join('')}</div>`}
function viewForStep(w,step,i){let lower=step.toLowerCase(),last=i===w.steps.length-1,active=w.main==='Live Session'?(w.sub==='Nora AI'?'Table':w.sub):w.main==='Players'?'Players':'Table';if(!['Table','Players','Team','Expenses','Snapshot','Close'].includes(active))active='Table';
if(w.id===5){if(i===0)return {active:'Table',body:miniTable()};if(i===1)return {active:'Table',body:`<div class="ux-profile">${portrait('Diego','D',true)}<div><b>DIEGO RESTREPO</b><small>SEAT 7 · TOTAL BUY-INS 450,000</small></div></div>${actionButtons(['REBUY','CASH OUT','MOVE','PLAYER DETAILS','BUST OUT','CANCEL'])}`};if(i===2)return {active:'Table',body:`<div class="ux-profile">${portrait('Diego','D',true)}<div><b>DIEGO RESTREPO</b><small>SEAT 7</small></div></div>${inputPanel('REBUY',['AMOUNT','PAYMENT METHOD'].map((x,j)=>[x,j?'Cashbox':'COP 1,000,000']),'CONFIRM REBUY')}`};return {active:'Table',body:miniTable(true)}}
if(w.id===1)return {active:'Table',body:miniTable()};
if(w.main==='Live Session'&&w.sub==='Table'&&i===0)return {active:'Table',body:miniTable()};
if(w.sub==='Nora AI')return {active:'Table',body:lower.includes('confirm')||lower.includes('review')?inputPanel('NORA UNDERSTOOD',[['PLAYER','Diego Restrepo'],['ACTION','Rebuy'],['AMOUNT','COP 1,000,000']],'CONFIRM ACTION'):lower.includes('record')||lower.includes('voice')?`<div class="ux-voice"><span>🎙</span><b>RECORDING</b><small>Speak your game instruction</small><div class="ux-wave">▂▅▃▇▄▆▃▅▂▇▅▃</div></div>`:miniTable()};
if(/seat|player tile|table view|table status|switch between tables|table tabs/.test(lower)&&w.main==='Live Session'&&w.sub==='Table')return {active:'Table',body:miniTable()};

}

function customPhone(w,step,i){if(w.id===67)return userProfileStage(w,step,i);if(w.id===34)return snapshotStage(w,step,i);if(w.id===56)return crm56Screen(w,step,i);if(w.id===11&&i===0){const source=WORKFLOWS.find(x=>x.id===5);return customPhone(source,source.steps[0],0).replace('<div class="stage-title">'+esc(source.steps[0])+'</div>','<div class="stage-title">'+esc(step)+'</div>');}if(w.id===11&&i>0)return ledgerStage(w,step,i);const sp=SCREEN_SPECS[w.id];const t=sp.types[Math.min(i,sp.types.length-1)];let active=w.main==='Live Session'?({Team:'Team',Expenses:'Expenses',Snapshot:'Snapshot',Close:'Close'}[w.sub]||'Table'):w.main==='Players'?'Players':w.main==='Team'?'Team':w.main==='Reporting'?'Snapshot':'Table';let title=w.main==='Live Session'?'LIVE SESSION':w.main.toUpperCase();let subtitle=w.main==='Live Session'?(w.sub==='Table'?(t.includes('rebuy')?'Rebuy':t.includes('cashout')?'Cash-out':t==='quick-actions'?'Player Actions':'Table View'):w.sub==='Nora AI'?'Nora AI':w.sub==='Close'?'Daily Close':w.sub):w.main==='Settings'?({onboarding:'Welcome', 'onboard-game':'Game setup','onboard-payment':'Review setup','onboard-done':'Setup complete','settings-home':'Settings','settings-game':'Game rules','settings-rake':'Rake rules','payment-methods':'Payment methods','payment-account':'Payment account','settings-ss':'Sign & Settle','settings-pin':'Owner PIN','settings-roles':'Team roles','settings-permissions':'Permissions','settings-menu':'Food & beverage','settings-inventory':'Inventory','profile-menu':'Profile','settings-preferences':'Preferences','settings-language':'Language','team-invite':'Invite team'}[t]||'Settings'):w.sub;return `<div class="stage hi-stage"><div class="stage-head"><div class="stage-number">${i+1}</div><div class="stage-title">${esc(step)}</div></div><div class="phone hi-phone"><div class="notch"></div>${fullHead(title,subtitle)}<div class="ux-content screen-specific">${w.id===11&&i===0?screenContent(WORKFLOWS.find(x=>x.id===5),WORKFLOWS.find(x=>x.id===5).steps[0],0):screenContent(w,step,i)}</div>${fixedNav(active)}</div><p class="steptext">${esc(sp.focus)} · ${esc(sp.values)}</p></div>`}

function show(id){current=id;let w=WORKFLOWS.find(w=>displayId(w.id)===id);if(!w)return;location.hash='workflow-'+id;let r=review(w.id);$('breadcrumb').textContent=`NORA / ${w.main} / ${w.sub}`;$('content').innerHTML=`<h1>${String(id).padStart(2,'0')}. ${esc(w.title)}</h1><p class="intro">Review the intended interaction in the same order a person would use it inside NORA. Swipe horizontally to see every step.</p><div class="meta"><span>${esc(w.main)}</span><span>${esc(w.sub)}</span><span>${w.steps.length} steps</span><span>Workflow ${id} of 71</span></div><div class="sectionlabel">Step-by-step mobile storyboard →</div><div class="storyboard">${w.steps.map((s,i)=>customPhone(w,s,i)).join('')}</div><div class="notice"><b>Review rule:</b> These are proposed NORA screens, not production screenshots or an interactive NORA app. Some screens require further business-rule and layout verification. Screen layouts and financial actions require your approval. The sequence and UI details require your approval. The existing live NORA app is not affected.${id===1?' <b>Workflow #1:</b> This is a screen-specific design proposal using illustrative player names and avatars, not production player photos. It requires your approval before developer handoff.':''}${id===5?' <b>Rebuy rule:</b> Show cumulative total buy-ins, never a supposed current physical chip stack.':''}</div><div class="review"><div class="panel"><h2>Decision</h2><div class="statusbuttons"><button data-status="pending" class="${r.status==='pending'?'selected pending':''}">Not reviewed</button><button data-status="approved" class="${r.status==='approved'?'selected approved':''}">✓ Approve</button><button data-status="changes" class="${r.status==='changes'?'selected changes':''}">✎ Needs changes</button></div><div class="saveinfo">Your decision is saved automatically on this device.</div></div><div class="panel"><h2>Comments / corrections</h2><label for="comments">What should change in this workflow?</label><textarea id="comments" placeholder="Example: Remove step 3. Make the amount larger. Keep the existing Table View.">${esc(r.comment)}</textarea><div class="saveinfo">Comments save as you type. Export to share them with the developer.</div></div></div><div class="footeractions"><button class="secondary" id="prev" ${id===1?'disabled':''}>← Previous</button><button class="primary" id="next" ${id===71?'disabled':''}>Next workflow →</button></div><p class="disclaimer">Prototype for review only. No connection to NORA’s production ledger, accounts, or player data.</p>`;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{reviews[w.id]={...review(w.id),status:b.dataset.status};save();show(id)});$('comments').oninput=e=>{reviews[w.id]={...review(w.id),comment:e.target.value};save()};$('prev').onclick=()=>show(Math.max(1,id-1));$('next').onclick=()=>show(Math.min(71,id+1));renderNav();$('sidebar').classList.remove('open');window.scrollTo(0,0)}function showAll(){current=0;$('breadcrumb').textContent='NORA / All workflows';$('content').innerHTML=`<h1>All 71 workflows</h1><p>Grouped by NORA's main navigation, with Live Session ordered Table → Nora AI → Team → Expenses → Snapshot → Close. Choose any workflow to review.</p><div class="allindex">${WORKFLOWS.map(w=>`<button class="indexcard" data-id="${displayId(w.id)}"><small>${esc(w.main)} / ${esc(w.sub)}</small><strong>${displayId(w.id)}. ${esc(w.title)}</strong><small>${esc(review(w.id).status)}</small></button>`).join('')}</div>`;document.querySelectorAll('.indexcard').forEach(b=>b.onclick=()=>show(+b.dataset.id));renderNav();$('sidebar').classList.remove('open')}function download(name,content){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}$('exportbtn').onclick=()=>download('nora-ux-review-decisions.json',JSON.stringify({app:'NORA UX Review',version:1,exported:new Date().toISOString(),reviews},null,2));$('importbtn').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.reviews||typeof data.reviews!=='object')throw Error('Invalid review file');if(!confirm('Import reviews from this file? This replaces reviews saved on this device.'))return;reviews=data.reviews;save();current?show(current):showAll();alert('Reviews imported successfully.')}catch(err){alert('Could not import: '+err.message)}e.target.value=''};$('allbtn').onclick=showAll;$('menubtn').onclick=()=>$('sidebar').classList.toggle('open');$('search').oninput=renderNav;updateProgress();let match=location.hash.match(/workflow-(\d+)/);show(match?Math.max(1,Math.min(71,+match[1])):1);</script></body></html>
