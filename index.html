const REVIEW_NAV_ICONS={"Table":"<rect x=\"2.5\" y=\"5\" width=\"19\" height=\"14\" rx=\"7\"/><path d=\"M7 9h10M7 15h10\"/><circle cx=\"12\" cy=\"12\" r=\"1\" fill=\"currentColor\" stroke=\"none\"/>","Players":"<path d=\"M5 9h14l-2-3H7zM8 6l4-3 4 3M5 9c3 2 11 2 14 0\"/><circle cx=\"12\" cy=\"13\" r=\"3.2\"/><path d=\"M4 22v-1a8 8 0 0 1 16 0v1\"/>","Team":"<path d=\"M4 7h16l-3-4H7zM4 7c3 3 13 3 16 0\"/><path d=\"M8 9v2M16 9v2\"/><circle cx=\"12\" cy=\"14\" r=\"3\"/><path d=\"M4 22a8 8 0 0 1 16 0M9 19l3 2 3-2\"/>","Expenses":"<path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3\"/>","Snapshot":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M7 16v-4M12 16V8M17 16v-6\"/>","Close":"<rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"/><path d=\"M8 12l3 3 5-6\"/>"};function fixedNav(active,refined=false){return `<div class="ux-bottom">${['Table','Players','Team','Expenses','Snapshot','Close'].map(x=>`<div class="ux-tab ${x===active?'chosen':''}"><span class="ux-ico">${refined?`<svg viewBox="0 0 24 24" aria-hidden="true">${REVIEW_NAV_ICONS[x]}</svg>`:ICONS[x]}</span><span>${x}</span></div>`).join('')}</div>`}
function fullHead(title,sub){return `<div class="ux-head"><span class="ux-hamb">☰</span><div class="ux-headtitle"><b>${esc(title)}</b><small>${esc(sub)}</small></div><span class="ux-nora">${portrait('Nora','N',true)}</span><span class="ux-close">×</span></div>`}
function miniTable(updated=false){let data=demoPeople.map(([name,initial,amount,photo],j)=>`<div class="ux-seat tone-${j%6}"><span class="ux-seatno">${j+1}</span>${portrait(name,initial,photo)}<div class="ux-seat-label"><b>${name}</b><strong>${updated&&name==='Diego R.'?'1,450,000':amount}</strong></div></div>`).join('');return `<div class="ux-seats">${data}<div class="ux-seat empty"><strong>⊕</strong><b>Open Seat</b></div><div class="ux-seat empty"><strong>⊕</strong><b>Open Seat</b></div><div class="ux-seat tone-4">${portrait('Anna','A',true)}<div class="ux-seat-label"><b>DEALER</b><strong>Anna</strong></div></div><div class="ux-seat empty"><strong>♙</strong><b>WAIT LIST</b><span>1 waiting</span></div></div>`}

function actionButtons(items){return `<div class="ux-actions">${items.map((x,j)=>`<div class="ux-action tone-${j%6}">${esc(x)}</div>`).join('')}</div>`}
function inputPanel(title,fields,button='CONFIRM'){return `<div class="ux-section">${esc(title)}</div>${fields.map(([k,v])=>`<div class="ux-field"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}<div class="ux-cta">${esc(button)}</div>`}
function listPanel(kind){let items=kind==='Team'?[['Anna','Dealer','ON SHIFT'],['Costa','Host','ON SHIFT'],['Alex','Cashier','ON SHIFT']]:kind==='Expenses'?[['Venue rental','Cash','1,000,000'],['Drinks','Cash','150,000'],['Food','Cash','85,000']]:[['Diego Restrepo','Seat 7','450,000'],['Rafa','Seat 1','450,000'],['Moshe','Seat 2','1,200,000']];return `<div class="ux-section">${esc(kind.toUpperCase())} · LIVE</div><div class="ux-list">${items.map(([n,s,v],i)=>`<div class="ux-listrow tone-${i%6}">${portrait(n,n[0],i!==1)}<div><b>${esc(n)}</b><small>${esc(s)}</small></div><strong>${esc(v)}</strong></div>`).join('')}</div><div class="ux-cta">＋ ADD ${kind==='Team'?'TEAM MEMBER':kind==='Expenses'?'EXPENSE':'PLAYER'}</div>`}
function metricPanel(kind){let entries=kind==='Snapshot'?[['TOTAL BUY-INS','COP 5,500,000'],['CASH-OUTS','COP 0'],['DROP / RAKE','COP 780,000'],['CHIPS IN PLAY','COP 5,500,000'],['TIPS','COP 0'],['NET BALANCE','COP 780,000'],['GROSS REVENUE','COP 780,000'],['PLAYERS','8'],['EXPENSES','COP 0'],['TABLE','Hold’em'],['RUNTIME','5d 6h 32m'],['RAKE STRUCTURE','5% per pot']]:kind==='Close'?[['TOTAL BUY-INS','5,500,000'],['TOTAL CASH-OUTS','0'],['TIPS IN CHIPS','0'],['CHIP VARIANCE','REVIEW'],['S&S OUTSTANDING','0'],['CASHBOX','5,500,000']]:[['TOTAL RAKE','780,000'],['HOURS','5.5'],['PLAYERS','8'],['AVG / HR','141,818'],['TABLES','1'],['GAME','Hold’em']];return `<div class="ux-metrics ${kind==='Snapshot'?'ux-snapshot':''}">${entries.map(([a,b],i)=>`<div class="ux-metric tone-${i%3===1?1:i%3===2?2:0}"><b>${b}</b><small>${a}</small></div>`).join('')}</div>`}

function customPhone(w,step,i){const sp=SCREEN_SPECS[w.id];const t=sp.types[Math.min(i,sp.types.length-1)];let active=w.main==='Live Session'?({Team:'Team',Expenses:'Expenses',Snapshot:'Snapshot',Close:'Close'}[w.sub]||'Table'):w.main==='Players'?'Players':w.main==='Team'?'Team':w.main==='Reporting'?'Snapshot':'Table';let title=w.main==='Live Session'?'LIVE SESSION':w.main.toUpperCase();let subtitle=w.main==='Live Session'?(w.sub==='Table'?(t.includes('rebuy')?'Rebuy':t.includes('cashout')?'Cash-out':t==='quick-actions'?'Player Actions':'Table View'):w.sub==='Nora AI'?'Nora AI':w.sub==='Close'?'Daily Close':w.sub):w.main==='Settings'?'Settings':w.sub;return `<div class="stage hi-stage"><div class="stage-head"><div class="stage-number">${i+1}</div><div class="stage-title">${esc(step)}</div></div><div class="phone hi-phone"><div class="notch"></div>${fullHead(title,subtitle)}<div class="ux-content screen-specific">${screenContent(w,step,i)}</div>${fixedNav(active,w.id===5&&i===0)}</div><p class="steptext">${esc(sp.focus)} · ${esc(sp.values)}</p></div>`}

function show(id){current=id;let w=WORKFLOWS.find(w=>w.id===id);if(!w)return;location.hash='workflow-'+id;let r=review(id);$('breadcrumb').textContent=`NORA / ${w.main} / ${w.sub}`;$('content').innerHTML=`<h1>${String(id).padStart(2,'0')}. ${esc(w.title)}</h1><p class="intro">Review the intended interaction in the same order a person would use it inside NORA. Swipe horizontally to see every step.</p><div class="meta"><span>${esc(w.main)}</span><span>${esc(w.sub)}</span><span>${w.steps.length} steps</span><span>Workflow ${id} of 73</span></div><div class="sectionlabel">Step-by-step mobile storyboard →</div><div class="storyboard">${w.steps.map((s,i)=>customPhone(w,s,i)).join('')}</div><div class="notice"><b>Review rule:</b> These are proposed NORA screens, not production screenshots or an interactive NORA app. Some screens require further business-rule and layout verification. Screen layouts and financial actions require your approval. The sequence and UI details require your approval. The existing live NORA app is not affected.${id===1?' <b>Workflow #1:</b> This is a screen-specific design proposal using illustrative player names and avatars, not production player photos. It requires your approval before developer handoff.':''}${id===5?' <b>Rebuy rule:</b> Show cumulative total buy-ins, never a supposed current physical chip stack.':''}</div><div class="review"><div class="panel"><h2>Decision</h2><div class="statusbuttons"><button data-status="pending" class="${r.status==='pending'?'selected pending':''}">Not reviewed</button><button data-status="approved" class="${r.status==='approved'?'selected approved':''}">✓ Approve</button><button data-status="changes" class="${r.status==='changes'?'selected changes':''}">✎ Needs changes</button></div><div class="saveinfo">Your decision is saved automatically on this device.</div></div><div class="panel"><h2>Comments / corrections</h2><label for="comments">What should change in this workflow?</label><textarea id="comments" placeholder="Example: Remove step 3. Make the amount larger. Keep the existing Table View.">${esc(r.comment)}</textarea><div class="saveinfo">Comments save as you type. Export to share them with the developer.</div></div></div><div class="footeractions"><button class="secondary" id="prev" ${id===1?'disabled':''}>← Previous</button><button class="primary" id="next" ${id===73?'disabled':''}>Next workflow →</button></div><p class="disclaimer">Prototype for review only. No connection to NORA’s production ledger, accounts, or player data.</p>`;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{reviews[id]={...review(id),status:b.dataset.status};save();show(id)});$('comments').oninput=e=>{reviews[id]={...review(id),comment:e.target.value};save()};$('prev').onclick=()=>show(Math.max(1,id-1));$('next').onclick=()=>show(Math.min(73,id+1));renderNav();$('sidebar').classList.remove('open');window.scrollTo(0,0)}function showAll(){current=0;$('breadcrumb').textContent='NORA / All workflows';$('content').innerHTML=`<h1>All 73 workflows</h1><p>Grouped by NORA's main navigation, with Live Session ordered Table → Nora AI → Team → Expenses → Snapshot → Close. Choose any workflow to review.</p><div class="allindex">${WORKFLOWS.map(w=>`<button class="indexcard" data-id="${w.id}"><small>${esc(w.main)} / ${esc(w.sub)}</small><strong>${w.id}. ${esc(w.title)}</strong><small>${esc(review(w.id).status)}</small></button>`).join('')}</div>`;document.querySelectorAll('.indexcard').forEach(b=>b.onclick=()=>show(+b.dataset.id));renderNav();$('sidebar').classList.remove('open')}function download(name,content){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}$('exportbtn').onclick=()=>download('nora-ux-review-decisions.json',JSON.stringify({app:'NORA UX Review',version:1,exported:new Date().toISOString(),reviews},null,2));$('importbtn').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.reviews||typeof data.reviews!=='object')throw Error('Invalid review file');if(!confirm('Import reviews from this file? This replaces reviews saved on this device.'))return;reviews=data.reviews;save();current?show(current):showAll();alert('Reviews imported successfully.')}catch(err){alert('Could not import: '+err.message)}e.target.value=''};$('allbtn').onclick=showAll;$('menubtn').onclick=()=>$('sidebar').classList.toggle('open');$('search').oninput=renderNav;updateProgress();let match=location.hash.match(/workflow-(\d+)/);show(match?Math.max(1,Math.min(73,+match[1])):1);</script></body></html>
