<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORA Desktop · Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#03111f;--card:#082b43;--bd:#00baff;--lab:#c5e4f2;--cop:#f7f4ea;--g:#22f0a4;--gd:#06513b;--a:#ffc04a;--r:#ff6b7d}
*{box-sizing:border-box;margin:0;border-radius:0!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:-3px}
small{font-size:65%;color:var(--cop);font-weight:900}
.i{width:22px;height:22px;fill:currentColor;flex:none}
.app{display:grid;grid-template-columns:208px minmax(0,1fr) clamp(360px,27vw,440px);grid-template-rows:72px minmax(0,1fr);height:100vh}
/* sidebar */
.side{grid-row:1/3;background:#041a2c;border-right:2px solid #0d4a6e;display:flex;flex-direction:column;padding:14px 12px;gap:6px;min-height:0}
.logo{font-size:30px;font-weight:900;letter-spacing:6px;color:#4cddff;padding:2px 8px 12px}
.nv{width:100%;display:flex;align-items:center;gap:12px;height:50px;padding:0 12px;border:2px solid transparent;background:none;font-size:16px;font-weight:800;white-space:nowrap;text-align:left}
.nv .ni{width:24px;height:24px}
.nvw:nth-of-type(2) .ni{color:#2de5be}.nvw:nth-of-type(3) .ni{color:#ffb866}.nvw:nth-of-type(4) .ni{color:#c59cff}.nvw:nth-of-type(5) .ni{color:#75c8ff}.nvw:nth-of-type(6) .ni{color:#9be79e}
.nv.on{background:var(--gd);border-color:#00ed94}.nv.on .ni{color:#00ff99}
.nv:hover:not(.on){background:#0b3a58}
.nv .chev{margin-left:auto;width:16px;height:16px;color:#c5e4f2;transition:transform .15s}
.nv.open .chev{transform:rotate(90deg)}
.sub{display:none;flex-direction:column;border:2px solid #1c4d6b;border-top:0;margin:-6px 0 2px}
.nv.open+.sub{display:flex}
.si{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px 0 18px;border:0;border-top:1px solid #163f58;background:#04182a;font-size:14.5px;font-weight:800;text-align:left}
.si:first-child{border-top:0}.si .sm{width:18px;height:18px;color:#4cddff}
.si.cur{background:#0b3a58;color:#5cf2b8}.si.cur .sm{color:#5cf2b8}.si:hover{background:#0b3a58}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid #1c4d6b;font-size:15px;font-weight:800}
.me i{width:36px;height:36px;display:grid;place-items:center;background:#16405c;border:2px solid #2fd4ff;font-style:normal;font-weight:900}
.me span{display:block;font-size:14px;color:var(--lab);font-weight:700}
/* header */
.head{grid-column:2/4;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:2px solid #0d4a6e;background:#041a2c;min-width:0}
.ht{border:3px solid #00b9ff;padding:5px 16px;background:#051a2c;flex:none}
.ht b{display:block;color:#00e3a4;font-size:14px;letter-spacing:1px}.ht span{display:block;font-size:18px;font-weight:900}
.pill{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border:2px solid #2fa6d9;background:#0b3a58;font-size:15px;font-weight:800;white-space:nowrap;flex:none}
.pill .pi{width:18px;height:18px;color:#4cddff}
.demo{font-size:14px;font-weight:900;color:#ffd38a;border:2px solid #f2a93b;background:#3d2a0e;padding:6px 10px;white-space:nowrap}
.tabs{display:flex;margin-left:auto;flex:none}
.ttab{height:42px;padding:0 16px;border:2px solid #2fa6d9;background:#0b3a58;font-size:15px;font-weight:800}
.ttab.on{background:var(--gd);border-color:var(--g)}
.nora{width:50px;height:50px;border:3px solid #31b7f7;overflow:hidden;padding:0;background:none;flex:none}
.nora img{width:100%;height:130%;object-fit:cover;object-position:50% 0}
/* center */
.main{padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.kpis{display:grid;grid-template-columns:1.35fr 1fr 1.15fr .8fr;gap:10px;flex:none}
.kpi{border:2px solid;padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.kpi span{font-size:14px;font-weight:900;color:#e6f6ff;white-space:nowrap}.kpi b{font-size:clamp(19px,1.6vw,27px);font-weight:900;white-space:nowrap}
.k1{background:linear-gradient(145deg,#1676b8,#0b3a64);border-color:#3cb8ff}.k2{background:linear-gradient(145deg,#0f9a6c,#06513b);border-color:var(--g)}
.k3{background:linear-gradient(145deg,#8a3fd1,#3d1a66);border-color:#c27bff}.k4{background:linear-gradient(145deg,#d99419,#6b4307);border-color:var(--a)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}
.seat{position:relative;border:3px solid var(--bd);background:#071d31;overflow:hidden;padding:0;text-align:center;min-width:0}
.seat:hover{outline:3px solid #fff;outline-offset:-3px}
.t-b{border-color:#00baff}.t-g{border-color:#00df9c}.t-p{border-color:#a548f5}.t-m{border-color:#fa57ae}.t-a{border-color:#ffc42e}
.seat.sel{border:4px solid #fff;box-shadow:inset 0 0 0 3px #22f0a4}
.no{position:absolute;top:6px;left:6px;z-index:2;background:#ffc529;border:2px solid #111;color:#111;font-size:16px;font-weight:900;padding:2px 7px}
.ph{position:absolute;inset:0;overflow:hidden;background:#16405c}
.ph img{width:100%;height:138%;object-fit:cover;object-position:50% 0}
.ph.ini{display:grid;place-items:center;font-size:clamp(40px,4vw,64px);font-weight:900;color:#f2fbff;padding-bottom:24%}
.lab{position:absolute;left:0;right:0;bottom:0;padding:26px 6px 8px;background:linear-gradient(rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 35%,rgba(0,0,0,.7))}
.lab b{display:block;font-size:clamp(17px,1.5vw,22px);font-weight:900;white-space:nowrap;line-height:1.1;text-shadow:0 1px 3px #000,0 0 2px #000}
.lab strong{display:block;font-size:clamp(19px,1.65vw,24px);font-weight:800;line-height:1.15;text-shadow:0 1px 3px #000,0 0 2px #000}
.lab b.dl{font-size:clamp(16px,1.35vw,20px);letter-spacing:.5px}
.ssf{position:absolute;top:6px;right:6px;z-index:2;background:#5a3a08;border:2px solid var(--a);color:#ffd38a;font-size:14px;font-weight:900;padding:1px 6px}
.seat.empty,.seat.wait{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-color:#3d84b2;background:linear-gradient(150deg,#062640,#05172a)}
.seat.empty.target{border-color:var(--g);background:linear-gradient(150deg,#0f9a6c,#06513b)}
.seat.empty b,.seat.wait b{font-size:clamp(16px,1.35vw,20px);font-weight:900}
.hint{font-size:16px;font-weight:700;color:#d3e4f3}
.i.huge{width:clamp(40px,3.6vw,60px);height:clamp(40px,3.6vw,60px);color:#4cddff}
.seat.dealer{border-color:var(--a)}
/* panel */
.panel{border-left:2px solid #0d4a6e;background:#041a2c;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;animation:pin .18s ease-out}
@keyframes pin{from{opacity:.4}to{opacity:1}}
.phd{display:flex;align-items:center;gap:8px;flex:none;min-height:36px}
.phd b{flex:1;font-size:16px;font-weight:900;color:var(--lab);letter-spacing:.5px}
.pbk{width:36px;height:36px;display:grid;place-items:center;border:2px solid #2fa6d9;background:#0b3a58;padding:0;flex:none}
.pbk .i{width:20px;height:20px}.pbk.x{margin-left:auto}
.hint2{font-size:14px;font-weight:700;color:var(--lab);line-height:1.35;flex:none}
.ptile{display:flex;gap:12px;padding:8px;border:3px solid var(--bd);background:linear-gradient(150deg,#0d4a6e,#082b43);height:clamp(140px,19vh,172px);flex:none}
.ptile .pic{flex:0 0 auto;aspect-ratio:.9;height:100%;border:2px solid #2fd4ff;overflow:hidden;display:grid;place-items:center;background:#16405c;font-size:44px;font-weight:900}
.ptile .pic img{width:130%;max-width:none;height:135%;margin-left:-22%;object-fit:cover;object-position:50% 0;align-self:start}
.pinfo{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.pinfo b{font-size:22px;font-weight:900;line-height:1.1}.pinfo .s{font-size:15px;font-weight:900}
.pinfo .l{font-size:14px;font-weight:900;color:var(--lab);margin-top:4px}.pinfo strong{font-size:24px;font-weight:900;white-space:nowrap}
.mini{display:flex;align-items:center;gap:12px;padding:8px;border:2px solid var(--bd);background:#0b3a58;flex:none}
.mf{width:52px;height:52px;flex:none;border:2px solid #2fd4ff;overflow:hidden;display:grid;place-items:center;background:#16405c;font-size:22px;font-weight:900}
.mf img{width:130%;max-width:none;height:135%;margin-left:-22%;object-fit:cover;object-position:50% 0;align-self:start}
.mini b{display:block;font-size:18px;font-weight:900}.mini span{display:block;font-size:14px;font-weight:800;color:var(--lab);white-space:nowrap}
.warn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:2px solid var(--a);background:#3d2a0e;color:#ffd38a;font-size:15px;font-weight:900;flex:none}
.warn .i{width:18px;height:18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.act{height:clamp(62px,8vh,78px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px solid;font-size:17px;font-weight:900}
.act .i{width:28px;height:28px}
.act.wide{grid-column:1/-1;flex-direction:row;gap:14px;height:clamp(54px,7vh,64px);font-size:20px}
.a1{background:#064d39;border-color:#00e39d}.a2{background:#382050;border-color:#c477fa}.a3{background:#4d3713;border-color:#f8bb39}.a4{background:#092c45;border-color:#08bafa}
.card{border:2px solid var(--bd);background:var(--card);padding:6px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;flex:none}
.card.grow{flex:1 1 auto;overflow:hidden}
.ct{font-size:14px;font-weight:900;color:var(--lab);letter-spacing:.4px;padding-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:38px;border-top:1px solid #38738c;font-size:15px;font-weight:800}
.row span{color:var(--lab)}.row b{font-size:17px;font-weight:900;white-space:nowrap;text-align:right}
.row.pos b{color:#5cf2b8}.row.neg b{color:#ff8a8f}.row.tot b{font-size:22px}
.empty{font-size:15px;font-weight:700;color:var(--lab);padding:10px 0}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.qt{height:clamp(74px,10.5vh,96px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:8px 12px;border:3px solid;text-align:left}
.qt .qi{width:26px;height:26px}.qt b{font-size:16px;font-weight:900}.qt span{font-size:14px;font-weight:700;white-space:nowrap}
.qa{background:linear-gradient(145deg,#d99419,#6b4307);border-color:var(--a)}.qr{background:linear-gradient(145deg,#d8324a,#6a1121);border-color:var(--r)}
.qb{background:linear-gradient(145deg,#1676b8,#0b3a64);border-color:#3cb8ff}.qp{background:linear-gradient(145deg,#8a3fd1,#3d1a66);border-color:#c27bff}
.qg{background:linear-gradient(145deg,#0f9a6c,#06513b);border-color:var(--g)}
.qt[data-go=nora]{background:linear-gradient(145deg,#14b3b0,#08595c);border-color:#3ff0ea}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;padding:0 12px;border:2px solid #2fa6d9;background:#0b3a58;font-size:15px;font-weight:900}
.chips button.on{border-color:var(--g);background:var(--gd)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:14px;font-weight:900;color:var(--lab)}
.fld input{height:46px;padding:0 12px;border:2px solid #2fd4ff;background:#0d3d5a;color:#fff;font:900 20px Inter;outline:0}
.fld.big input{height:54px;font-size:26px}
.ss{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--a);background:#3d2a0e;color:#ffd38a;font-size:15px;font-weight:900;cursor:pointer}
.ss input{width:22px;height:22px;accent-color:#ffc04a}
.oseats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.os{height:44px;border:2px solid #2fa6d9;background:#0b3a58;font-size:15px;font-weight:900}
.os.on{border-color:var(--g);background:var(--gd)}
.pft{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.btn{height:56px;border:3px solid;font-size:18px;font-weight:900}
.btn.sec{background:#073552;border-color:#00baff}.btn.pri{background:#005e3b;border-color:#00e39d}.btn.sec2{background:#0b3a58;border-color:#2fa6d9;font-size:16px}
.review{border-color:var(--a)}
.note{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#ffd38a;padding:6px 0 2px;margin-top:auto}
.note .i{width:18px;height:18px}
.ok{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px;border:3px solid var(--g);background:linear-gradient(150deg,#064d40,#07334a)}
.ok .okc{width:72px;height:72px;color:#4df4b9}.ok b{font-size:22px;font-weight:900}.ok span{font-size:16px;font-weight:800}
.ok em{font-style:normal;font-size:14px;font-weight:900;color:#ffd38a;border:2px solid #f2a93b;background:#3d2a0e;padding:4px 8px;margin-top:4px}
.net{border:3px solid var(--g);background:linear-gradient(145deg,#0f9a6c,#06513b);padding:10px 14px;flex:none}
.net.neg{border-color:var(--r);background:linear-gradient(145deg,#d8324a,#6a1121)}
.net span{display:block;font-size:14px;font-weight:900}.net b{display:block;font-size:30px;font-weight:900;line-height:1.1}.net em{font-style:normal;font-size:14px;font-weight:800;opacity:.92}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.m{border:2px solid var(--bd);background:var(--card);padding:8px 10px}.m span{display:block;font-size:14px;font-weight:900;color:var(--lab)}.m b{display:block;font-size:19px;font-weight:900;white-space:nowrap}
.accs{padding:4px 10px}
.acc{border-top:1px solid #38738c}.acc:first-child{border-top:0}
.ah{width:100%;height:42px;display:flex;align-items:center;justify-content:space-between;border:0;background:none;font-size:15px;font-weight:900;color:#fff;padding:0}
.ah .ch{width:16px;height:16px;color:var(--lab);transition:transform .15s}.acc.open .ah .ch{transform:rotate(90deg)}
.ab .row{min-height:32px}
.crow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid #38738c}.crow:first-child{border-top:0}
.crow b{display:block;font-size:16px;font-weight:900}.crow span{display:block;font-size:14px;font-weight:700;color:var(--lab)}
.st{width:30px;height:30px;flex:none;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:18px;border:2px solid}
.sg{background:#0f9a6c;border-color:#22f0a4}.sa{background:#b07a12;border-color:#ffc04a}.sr{background:#a5233a;border-color:#ff6b7d}
.srow{display:flex;align-items:center;gap:12px;min-height:66px;border-top:1px solid #38738c}.srow:first-child{border-top:0}
.srow>div{flex:1;min-width:0}.srow b{display:block;font-size:17px;font-weight:900}.srow span{display:block;font-size:14px;font-weight:700;color:var(--lab)}
.srow strong{font-size:15px;font-weight:900;white-space:nowrap}.pos{color:#5cf2b8}.neg{color:#ff8a8f}
/* nora */
.nctx{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid #2fd4ff;background:#0b3a58;font-size:15px;font-weight:900;flex:none;white-space:nowrap;overflow:hidden}
.nctx .i{width:18px;height:18px;color:#4cddff}
.thread{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.nb,.ub{max-width:90%;padding:10px 12px;font-size:15px;line-height:1.35;border:2px solid}
.nb{align-self:flex-start;background:#0b2f48;border-color:#2fa6d9}
.ub{align-self:flex-end;background:#0e5a3f;border-color:var(--g)}.ub em{display:block;font-style:normal;font-size:14px;font-weight:900;color:#b9f7dc;margin-bottom:2px}
.ntiles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;flex:none}
.nt{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px solid;font-size:16px;font-weight:900}
.nt .i{width:28px;height:28px}
.comp{flex:none;border-top:2px solid #1f6f97;padding-top:8px;height:72px}
.comp>div{display:none;align-items:center;gap:8px;height:62px}
.comp.idle .c-idle,.comp.rec .c-rec,.comp.proc .c-proc{display:flex}
.c-idle input{flex:1;min-width:0;height:54px;padding:0 12px;border:2px solid #2fd4ff;background:#0d3d5a;color:#fff;font:700 16px Inter;outline:0}
.send{width:54px;height:54px;border:2px solid var(--g);background:var(--gd);display:grid;place-items:center}
.mic{width:60px;height:60px;border-radius:50%!important;border:3px solid #4cddff;background:radial-gradient(circle at 35% 30%,#1fa8e0,#0b4f78);display:grid;place-items:center;animation:br 3.2s ease-in-out infinite}
.mic .i{width:28px;height:28px}
@keyframes br{0%,100%{box-shadow:0 0 0 0 rgba(76,221,255,.25)}50%{box-shadow:0 0 0 7px rgba(76,221,255,.12)}}
.cancel{height:54px;padding:0 10px;border:2px solid #9fc6dc;background:#0b3a58;font-size:15px;font-weight:900;display:flex;align-items:center;gap:4px}
.cancel .i{width:16px;height:16px}
.wave{flex:1;min-width:0;height:54px;display:flex;align-items:center;justify-content:center;gap:3px;border:2px solid var(--r);background:#3d0d18;overflow:hidden}
.wave i{display:block;flex:none;width:4px;height:10px;background:#ff8a8f;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(4n){animation-delay:.45s}
@keyframes wv{0%,100%{height:8px}50%{height:32px}}
.dot{width:10px;height:10px;border-radius:50%!important;background:#ff4d63;animation:bl 1s infinite;margin-right:4px}@keyframes bl{50%{opacity:.25}}
.tm{font-size:16px;font-weight:900;margin-left:6px;font-variant-numeric:tabular-nums}
.stop{width:60px;height:60px;border-radius:50%!important;border:3px solid #ffb3bb;background:#d8324a;display:grid;place-items:center;position:relative}
.stop::before,.stop::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid rgba(255,107,125,.7);animation:rg 1.6s ease-out infinite}
.stop::after{animation-delay:.8s}@keyframes rg{from{transform:scale(1);opacity:.9}to{transform:scale(1.55);opacity:0}}
.stop span{width:20px;height:20px;background:#fff}
.c-proc{justify-content:center;font-size:16px;font-weight:900;color:#e6d4ff}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%!important;background:#c27bff;animation:bo 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bo{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-7px);opacity:1}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#0b3a58;border:2px solid #4cddff;padding:12px 18px;font-size:16px;font-weight:800;transition:.2s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1380px){.demo{display:none}}
.kpi span{overflow:hidden;text-overflow:clip}

/* ===== v2 refinement: responsive control center ===== */
:root{--rail:76px;--rail-w:248px}
.hamb,.tasksbtn,.bnav,.scrim{display:none}
/* grid: portrait tiles, always filling the canvas at a fixed ratio */
.gridwrap{flex:1;min-height:0;container-type:size}
.grid{--cols:4;--rows:3;--gap:10px;--r:.84;width:100%;height:100%;

 if(d.kind==='expense'){S.expenses+=d.amt;S.log.push([tm,d.cat+' expense',cop(d.amt)]);d.doneTitle='EXPENSE RECORDED';d.doneLine=d.cat+' · '+esc(d.desc)+' · '+cop(d.amt);d.back=S.sel?'player':'session';}
