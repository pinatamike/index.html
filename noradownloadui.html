const storageKey='nora-ux-review-v1';let reviews={};try{reviews=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}let current=1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(storageKey,JSON.stringify(reviews));updateProgress();renderNav()};const review=id=>reviews[id]||{status:'pending',comment:''};function updateProgress(){let count=WORKFLOWS.filter(w=>review(w.id).status==='approved').length;$('progressText').textContent=count+' / 73';$('progressBar').style.width=count/73*100+'%'}function renderNav(){let q=$('search').value.trim().toLowerCase();let groups=[];for(let w of WORKFLOWS){if(q&&!(`${w.id} ${w.title} ${w.main} ${w.sub}`).toLowerCase().includes(q))continue;let g=groups.find(g=>g.main===w.main);if(!g){g={main:w.main,subs:[]};groups.push(g)}let s=g.subs.find(s=>s.name===w.sub);if(!s){s={name:w.sub,items:[]};g.subs.push(s)}s.items.push(w)}$('nav').innerHTML=groups.map(g=>`<div class="navgroup"><div class="navtitle">${esc(g.main)} <small>${g.subs.reduce((n,s)=>n+s.items.length,0)} workflows</small></div>${g.subs.map(s=>`<div class="subheading">${esc(s.name)}</div>${s.items.map(w=>`<button class="navitem ${current===w.id?'active':''}" data-id="${w.id}"><span class="num">${String(w.id).padStart(2,'0')}</span><span>${esc(w.title)}</span><span class="dot ${esc(review(w.id).status)}"></span></button>`).join('')}`).join('')}</div>`).join('');document.querySelectorAll('.navitem').forEach(el=>el.onclick=()=>show(+el.dataset.id))}function phone(w,step,i){let title=step.replace(/^[^a-zA-Z]+/,'');let last=i===w.steps.length-1;let rebuy=w.title==='Rebuy existing player';let display=rebuy?([['LIVE SESSION','Table View','DIEGO RESTREPO','SEAT 7 · TOTAL BUY-INS','COP 450,000','Select player'],['PLAYER','Quick Actions','DIEGO RESTREPO','REBUY','Cash Out · Move · Details','Choose Rebuy'],['REBUY','Enter Details','DIEGO RESTREPO','AMOUNT: COP 1,000,000','Payment: Cashbox','Confirm Rebuy'],['LIVE SESSION','Table View','DIEGO RESTREPO','SEAT 7 · TOTAL BUY-INS','COP 1,450,000','Updated']][i]||[]):null;let head=display?display[0]:w.main.toUpperCase(),sub=display?display[1]:w.sub,big=display?display[2]:title,box=display?display[3]:i===0?'START HERE':last?'RESULT / NEXT STATE':`STEP ${i+1}`,detail=display?display[4]:title,button=display?display[5]:last?'Continue':'Next action';return `<div class="stage"><div class="stage-head"><div class="stage-number">${i+1}</div><div class="stage-title">${esc(step)}</div></div><div class="phone"><div class="notch"></div><div class="phonehead"><small>☰</small><div style="text-align:center"><b>${esc(head)}</b><br><small>${esc(sub)}</small></div><div class="avatar">N</div></div><div class="phonebody"><div class="phonecaption">${esc(w.title)}</div><div class="phonebig">${esc(big)}</div><div class="screenbox ${last?'green':'active'}">${esc(box)}</div><div class="screenbox ${last?'green':''}">${esc(detail)}</div><div class="smallnote">${esc(step)}</div><div class="phonebtn ${last?'confirm':''}">${esc(button)}</div></div><div class="phonebottom"><span>TABLE</span><span>PLAYERS</span><span>TEAM</span><span>EXPENSES</span><span>SNAPSHOT</span><span>CLOSE</span></div></div><div class="steptext">Step ${i+1} of ${w.steps.length}</div></div>`}function show(id){current=id;let w=WORKFLOWS.find(w=>w.id===id);if(!w)return;location.hash='workflow-'+id;let r=review(id);$('breadcrumb').textContent=`NORA / ${w.main} / ${w.sub}`;$('content').innerHTML=`<h1>${String(id).padStart(2,'0')}. ${esc(w.title)}</h1><p class="intro">Review the intended interaction in the same order a person would use it inside NORA. Swipe horizontally to see every step.</p><div class="meta"><span>${esc(w.main)}</span><span>${esc(w.sub)}</span><span>${w.steps.length} steps</span><span>Workflow ${id} of 73</span></div><div class="sectionlabel">Step-by-step mobile storyboard →</div><div class="storyboard">${w.steps.map((s,i)=>phone(w,s,i)).join('')}</div><div class="notice"><b>Review rule:</b> These are illustrative, editable workflow wireframes—not final approved NORA screenshots. The sequence and UI details require your approval. The existing live NORA app is not affected.${id===5?' <b>Rebuy rule:</b> Show cumulative total buy-ins, never a supposed current physical chip stack.':''}</div><div class="review"><div class="panel"><h2>Decision</h2><div class="statusbuttons"><button data-status="pending" class="${r.status==='pending'?'selected pending':''}">Not reviewed</button><button data-status="approved" class="${r.status==='approved'?'selected approved':''}">✓ Approve</button><button data-status="changes" class="${r.status==='changes'?'selected changes':''}">✎ Needs changes</button></div><div class="saveinfo">Your decision is saved automatically on this device.</div></div><div class="panel"><h2>Comments / corrections</h2><label for="comments">What should change in this workflow?</label><textarea id="comments" placeholder="Example: Remove step 3. Make the amount larger. Keep the existing Table View.">${esc(r.comment)}</textarea><div class="saveinfo">Comments save as you type. Export to share them with the developer.</div></div></div><div class="footeractions"><button class="secondary" id="prev" ${id===1?'disabled':''}>← Previous</button><button class="primary" id="next" ${id===73?'disabled':''}>Next workflow →</button></div><p class="disclaimer">Prototype for review only. No connection to NORA’s production ledger, accounts, or player data.</p>`;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{reviews[id]={...review(id),status:b.dataset.status};save();show(id)});$('comments').oninput=e=>{reviews[id]={...review(id),comment:e.target.value};save()};$('prev').onclick=()=>show(Math.max(1,id-1));$('next').onclick=()=>show(Math.min(73,id+1));renderNav();$('sidebar').classList.remove('open');window.scrollTo(0,0)}function showAll(){current=0;$('breadcrumb').textContent='NORA / All workflows';$('content').innerHTML=`<h1>All 73 workflows</h1><p>Grouped by NORA's main navigation, with Live Session ordered Table → Nora AI → Team → Expenses → Snapshot → Close. Choose any workflow to review.</p><div class="allindex">${WORKFLOWS.map(w=>`<button class="indexcard" data-id="${w.id}"><small>${esc(w.main)} / ${esc(w.sub)}</small><strong>${w.id}. ${esc(w.title)}</strong><small>${esc(review(w.id).status)}</small></button>`).join('')}</div>`;document.querySelectorAll('.indexcard').forEach(b=>b.onclick=()=>show(+b.dataset.id));renderNav();$('sidebar').classList.remove('open')}function download(name,content){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}$('exportbtn').onclick=()=>download('nora-ux-review-decisions.json',JSON.stringify({app:'NORA UX Review',version:1,exported:new Date().toISOString(),reviews},null,2));$('importbtn').onclick=()=>$('importfile').click();$('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.reviews||typeof data.reviews!=='object')throw Error('Invalid review file');if(!confirm('Import reviews from this file? This replaces reviews saved on this device.'))return;reviews=data.reviews;save();current?show(current):showAll();alert('Reviews imported successfully.')}catch(err){alert('Could not import: '+err.message)}e.target.value=''};$('allbtn').onclick=showAll;$('menubtn').onclick=()=>$('sidebar').classList.toggle('open');$('search').oninput=renderNav;updateProgress();let match=location.hash.match(/workflow-(\d+)/);show(match?Math.max(1,Math.min(73,+match[1])):1);</script></body></html>
